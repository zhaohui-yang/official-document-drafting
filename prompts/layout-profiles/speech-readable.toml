id = "speech-readable"
display_name = "讲话稿阅读版式方案"
description = "适用于讲话稿、会议发言稿等强调台上朗读和快速定位层次的材料。"
body_line_spacing_twips = 600
title_line_spacing_twips = 600
header_after_twips = 300
doc_number_after_twips = 300
title_after_twips = 600
recipient_after_twips = 600
signing_before_twips = 1800
body_first_line_chars = 200
# 页边距按 GB/T 9704-2012：上 37mm、下 35mm、左 28mm、右 26mm（1mm ≈ 56.6929 twips）。
# 导出脚本当前以 src/scripts/generate_docx.py 的 MARGIN_*_TWIPS 常数落地执行；
# 此处为声明主源，两处数值由 tests/test_generate_docx.py 的防漂移用例保证一致。
margin_top_twips = 2098
margin_bottom_twips = 1984
margin_left_twips = 1587
margin_right_twips = 1474
notes = [
  "正文固定行距 600 twips，即 30pt，兼顾投屏、打印和会场朗读。",
  "版式留白略大于正式公文，方便领导批注和会场阅读；正文与落款之间默认空 3 行。",
]
