model = "gpt-5.6-terra"
model_reasoning_effort = "xhigh"
model_verbosity = "low"
model_reasoning_summary = "concise"
hide_agent_reasoning = true
web_search = "live"
sandbox_mode = "danger-full-access"
approval_policy = "never"

[features]
fast_mode = false
multi_agent = true
shell_snapshot = true
apps = true

[agents]
max_threads = 4
max_depth = 2
job_max_runtime_seconds = 7200
